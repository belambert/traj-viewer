[project]
name = "traj-viewer"
version = "0.1.0"
description = "View agent trajectories"
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.1.1",
    "pyarrow>=25.0.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
traj-viewer = "traj_viewer.cli:app"
